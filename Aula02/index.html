<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>Controle de formularios</title>
    </head>
    <body>
        <h1>Preferência</h1>
        <form>
            <label for="nome">nome:</label>
            <input type="text" id="nome" name="nome">
            <br>
            <label for="Turno" Qual turno você prefere estudar?>
            <input type="radio" id="manha" name="Turno"><label for="manha">Manhã</label><br>
            <input type="radio" id="tarde" name="Turno"><label for="tarde">Tarde</label><br>
            <input type="radio" id="noite" name="Turno"><label for="noite">Noite</label><br>
            <label for="areas" Quais áreas ds tecnologia vc tem interesse?>
                <input type="checkbox" id="programação" name="areas"><label for="programação">Programação</label><br>
                <input type="checkbox" id="desing" name="areas"><label for="">Desing</label><br>
                <input type="checkbox" id="banco de dados" name="areas"><label for="banco de dados">Banco de Dados</label><br>
                <input type="checkbox" id="redes" name="areas"><label for="redes">Redes</label><br>
            
                <label for="cor" Qual sua cor favorita?>
                <input type="color" name="cor"><br>
                <label for="barrinha" Qual seu nivel de satisfação?>
                <input type="range" name="barrinha"><br>
                <label for="tempo" Qual seu horario preferido?>
                <input type="time" name="tempo"><br>
                <label for="arquivo" Envie um arquivo ></label><input type="file" name="arquivo"><br>
                <input type="submit" value="Cadastrar">
                <input type="reset" value="Limpar">
        </form>
    </body>
</html>
